<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460">
  <defs>
    <linearGradient id="capTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3f68" />
      <stop offset="100%" stop-color="#101a30" />
    </linearGradient>
    <linearGradient id="capBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2a4a" />
      <stop offset="100%" stop-color="#101a30" />
    </linearGradient>
    <clipPath id="flagClip">
      <path d="M60,55 C120,40 180,72 245,56 C285,46 305,62 300,80
               L292,150 C300,168 282,182 245,172 C182,156 120,186 68,172
               C55,168 52,158 55,148 Z" />
    </clipPath>
  </defs>

  <!-- Flagpole -->
  <circle cx="58" cy="42" r="7" fill="#101a30" />
  <rect x="54" y="42" width="7" height="185" rx="2" fill="#101a30" />

  <!-- Waving flag (Guernsey flag: St George's cross in red, Cross of William in gold, on white) -->
  <g clip-path="url(#flagClip)">
    <rect x="40" y="30" width="280" height="160" fill="#ffffff" />
    <!-- Cross of St George (red) -->
    <rect x="40" y="88" width="280" height="40" fill="#c8202f" />
    <rect x="148" y="30" width="40" height="160" fill="#c8202f" />
    <!-- Cross of William (gold) -->
    <rect x="40" y="99" width="280" height="18" fill="#d9a827" />
    <rect x="159" y="30" width="18" height="160" fill="#d9a827" />
  </g>
  <path d="M60,55 C120,40 180,72 245,56 C285,46 305,62 300,80
           L292,150 C300,168 282,182 245,172 C182,156 120,186 68,172
           C55,168 52,158 55,148 Z"
        fill="none" stroke="#e2e2e2" stroke-width="1.5" opacity="0.6" />

  <!-- Mortarboard -->
  <g>
    <polygon points="90,260 210,215 330,260 210,300" fill="url(#capTop)" stroke="#0c1526" stroke-width="2" />
    <path d="M140,278 L280,278 L260,325 L160,325 Z" fill="url(#capBase)" stroke="#0c1526" stroke-width="2" />
    <circle cx="210" cy="258" r="8" fill="#0c1526" />
    <path d="M204,262 C186,284 168,300 159,328" fill="none" stroke="#d9a827" stroke-width="3" stroke-linecap="round" />
    <circle cx="157" cy="334" r="6" fill="#d9a827" />
    <g stroke="#d9a827" stroke-width="2.5" stroke-linecap="round">
      <line x1="152" y1="339" x2="147" y2="358" />
      <line x1="157" y1="341" x2="156" y2="360" />
      <line x1="162" y1="339" x2="166" y2="357" />
    </g>
  </g>

  <!-- Wordmark -->
  <text x="200" y="400" text-anchor="middle" font-family="Cambria, Georgia, 'Times New Roman', serif"
        font-size="58" font-weight="700" fill="#1b2a4a" letter-spacing="2">
    CHANNEL
  </text>
  <line x1="35" y1="428" x2="130" y2="428" stroke="#2b6cb0" stroke-width="2" />
  <text x="200" y="435" text-anchor="middle" font-family="Calibri, Arial, sans-serif"
        font-size="26" font-weight="600" fill="#2b6cb0" letter-spacing="6">
    TUTORING
  </text>
  <line x1="270" y1="428" x2="365" y2="428" stroke="#2b6cb0" stroke-width="2" />
</svg>
